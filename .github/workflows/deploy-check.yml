name: Verify KrishakDrishti
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm --prefix backend run build
      - name: Comprehensive backend test suite (unit, integration, security, e2e)
        run: npm --prefix backend run test:all
        env:
          DEMO_MODE: 'true'
          IOT_SIMULATOR_ENABLED: 'false'
          NODE_ENV: test
      - name: Backend coverage report
        run: npm --prefix backend run test:coverage
        env:
          DEMO_MODE: 'true'
          IOT_SIMULATOR_ENABLED: 'false'
          NODE_ENV: test
      - name: HTTP security smoke tests
        run: node backend/scripts/smoke-api.mjs
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Frontend unit, a11y & localization tests
        run: npm --prefix frontend run test
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Build-time API URL configured in Vercel, not required for static CI checks.
